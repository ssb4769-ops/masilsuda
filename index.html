        // ==================== Supabase 데이터 연동 ====================
        function masilToRow(m) {
            return {
                category: m.category, date_badge: m.dateBadge, full_date: m.fullDate,
                max_spots: m.maxSpots, current_spots: m.currentSpots, photo: m.photo,
                title: m.title, location: m.location, map_hint: m.mapHint, cost: m.cost,
                target_desc: m.targetDesc, host_name: m.hostName, host_photo: m.hostPhoto,
                description: m.description, participants: m.participants
            };
        }

        function rowToMasil(r) {
            const participants = r.participants || [];
            return {
                id: r.id, category: r.category, dateBadge: r.date_badge, fullDate: r.full_date,
                maxSpots: r.max_spots, currentSpots: r.current_spots, photo: r.photo || PHOTO_ASSETS.tea1,
                title: r.title, location: r.location, mapHint: r.map_hint || '', cost: r.cost || '',
                targetDesc: r.target_desc || '', hostName: r.host_name, hostPhoto: r.host_photo || PHOTO_ASSETS.me,
                description: r.description || '', participants,
                joined: participants.some(p => p.name.includes('(나)'))
            };
        }

        function rowToMessage(r) {
            const time = new Date(r.created_at).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
            return { sender: r.sender, photo: r.photo, text: r.text, time, isMe: r.is_me };
        }

        function makeMasilRoom(m) {
            return {
                id: `chat-masil-${m.id}`,
                type: 'group',
                badgeLabel: m.dateBadge,
                relationType: null,
                title: m.title,
                memberCount: m.currentSpots,
                lastMsg: '함께하는 마실 수다방입니다.',
                time: '',
                unread: 0,
                confirmed: true,
                schedule: { date: m.fullDate, place: m.location, mapDetail: m.mapHint },
                messages: [
                    { sender: m.hostName + ' (마실장)', photo: m.hostPhoto, text: '환영합니다! 함께하게 되어 반갑습니다.', time: '', isMe: false }
                ]
            };
        }

        // 서버에서 마실 목록을 불러옵니다. 비어 있으면 예시 마실을 한 번 넣어 둡니다.
        async function loadFromDb() {
            if (!db) return;
            try {
                let { data, error } = await db.from('masils').select('*').order('id', { ascending: false });
                if (error) throw error;
                if (data.length === 0) {
                    const seeded = await db.from('masils').insert(masils.slice().reverse().map(masilToRow)).select();
                    if (seeded.error) throw seeded.error;
                    data = seeded.data.slice().reverse();
                }
                masils = data.map(rowToMasil);
                masils.filter(m => m.joined).forEach(m => {
                    if (!chatRooms.find(c => c.id === `chat-masil-${m.id}`)) chatRooms.push(makeMasilRoom(m));
                });
                if (state.currentTab === 'home' || state.currentTab === 'chat') renderCurrentTab();
                updateChatBadge();
            } catch (e) {
                console.error(e);
                showToast('서버에 연결하지 못해 예시 데이터로 보여드립니다.');
            }
        }

        function saveMessage(roomId, msg) {
            if (!db) return;
            db.from('chat_messages')
                .insert({ room_id: roomId, sender: msg.sender, photo: msg.photo, text: msg.text, is_me: msg.isMe })
                .then(({ error }) => { if (error) { console.error(error); showToast('수다 저장에 실패했습니다.'); } });
        }

        // 수다방을 처음 열 때 서버에 저장된 메시지를 이어 붙입니다.
        async function loadRoomMessages(room) {
            if (!db || room.dbLoaded) return;
            room.dbLoaded = true;
            const { data, error } = await db.from('chat_messages').select('*').eq('room_id', room.id).order('id');
            if (error) { console.error(error); return; }
            if (data.length === 0) return;
            room.messages = room.messages.concat(data.map(rowToMessage));
            room.lastMsg = data[data.length - 1].text;
            if (state.activeChatId === room.id && !document.getElementById('subpage-container').classList.contains('hidden')) {
                renderChatRoomContent(room);
            }
        }

            clearTimeout(window.toastTimer);

            }, 2800);
        }

            m.currentSpots += 1;
            m.participants.push({
                name: '최순자 (나)',
                isHost: false,
                age: '66세 · 여성',
                tag: '#반가워요',
                photo: PHOTO_ASSETS.me
            });

            if (db) {
                db.from('masils').update({ current_spots: m.currentSpots, participants: m.participants }).eq('id', m.id)

            const newChatId = `chat-masil-${m.id}`;
            chatRooms.unshift({

                badgeLabel: m.dateBadge,
                relationType: null,

        async function submitNewMasil(e) {

            const dateStr = document.getElementById('new-date').value;
            const loc = document.getElementById('new-location').value;
            const maxSpots = parseInt(document.getElementById('new-max').value, 10);

            const newMasil = {
                id: Date.now(),
                category: cat,
                dateBadge: dateStr,
                fullDate: dateStr,
                maxSpots: maxSpots,
                currentSpots: 1,
                photo: PHOTO_ASSETS.tea1,
                title: title,
                location: loc,
                mapHint: `${loc} 앞에서 10분 전까지 모입니다.`,
                cost: '각자 지출 부담 (더치페이)',
                targetDesc: `60~70대 이웃 누구나 (총 ${maxSpots}명)`,
                hostName: '최순자 (나)',
                hostPhoto: PHOTO_ASSETS.me,
                description: '새로 만든 마실입니다. 편한 마음으로 함께 걸으며 좋은 이웃이 되어요!',

                ],
                joined: true
            };

            if (db) {
                const { data, error } = await db.from('masils').insert(masilToRow(newMasil)).select().single();
                if (error) {
                    console.error(error);
                    showToast('마실을 서버에 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                    return;
                }
                newMasil.id = data.id;
            }
            const newId = newMasil.id;
            masils.unshift(newMasil);

            chatRooms.unshift({
                id: `chat-masil-${newId}`,
                type: 'group',
                badgeLabel: dateStr,
                relationType: null,
                title: title,
                memberCount: 1,
                lastMsg: '내가 만든 마실 수다가 열렸습니다.',
                time: '방금 전',
                unread: 0,
                confirmed: true,
                schedule: { date: dateStr, place: loc, mapDetail: `${loc} 앞 만남` },
                messages: [
                    { sender: '최순자 (나)', photo: PHOTO_ASSETS.me, text: '안녕하세요! 마실을 개설했습니다. 반갑습니다.', time: '방금 전', isMe: true }
                ]
            });

            closeModal();
            state.selectedCategory = '전체';
            renderCurrentTab();
            showToast('✨ 새 마실이 등록되었습니다!');
        }

        // ==================== [탭 2: 이웃 (90% 화이트 바탕 + 10% 그린/로즈 핑크 핵심 버튼)] ====================
        function renderNeighborsTab(container) {
            let filteredPeople = neighborList.filter(p => p.type === state.neighborMode);
            if (state.neighborFilter === 'local') {
                const localOnly = filteredPeople.filter(p => p.isLocal);
                if (localOnly.length > 0) filteredPeople = localOnly;
            }

            const currentPerson = filteredPeople[state.neighborIndex % filteredPeople.length];
            const isRomance = state.neighborMode === 'romance';

            const quickFilters = [
                { id: 'all', label: '전체 보기' },
                { id: 'local', label: '우리 동네만' },
                { id: 'age', label: '비슷한 나이대' },
                { id: 'interest', label: '관심사 일치' }
            ];

            container.innerHTML = `
                <div class="fade-in">
                    <!-- 최상단 50:50 모드 전환 스위치 (진한 채우기 대신 부드러운 연한 틴트 + 컬러 테두리) -->
                    <header class="bg-[#FFFFFF] p-4 border-b border-[#E5E7EB] sticky top-0 z-10 space-y-3">
                        <div class="grid grid-cols-2 gap-2 bg-[#F7F8FA] p-1.5 rounded-2xl border border-[#E5E7EB]">
                            <button onclick="switchNeighborMode('friend')" class="py-3 rounded-xl font-black text-base transition-colors border ${
                                !isRomance
                                    ? 'bg-[#EDF4F0] text-[#2E5A44] border-[#2E5A44]'
                                    : 'border-transparent text-[#6B7280] hover:bg-[#FFFFFF]'
                            }">
                                🤝 편한 친구 찾기
                            </button>
                            <button onclick="switchNeighborMode('romance')" class="py-3 rounded-xl font-black text-base transition-colors border ${
                                isRomance
                                    ? 'bg-[#FDF1F4] text-[#C85A7C] border-[#C85A7C]'
                                    : 'border-transparent text-[#6B7280] hover:bg-[#FFFFFF]'
                            }">
                                💕 설레는 인연 찾기
                            </button>
                        </div>

                        <!-- 간편 조건 필터 -->
                        <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
                            ${quickFilters.map(f => `
                                <button onclick="setNeighborFilter('${f.id}')" class="px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap border ${
                                    state.neighborFilter === f.id
                                        ? (isRomance ? 'bg-[#FDF1F4] text-[#C85A7C] border-[#C85A7C]' : 'bg-[#EDF4F0] text-[#2E5A44] border-[#2E5A44]')
                                        : 'bg-[#FFFFFF] text-[#6B7280] border-[#E5E7EB]'
                                }">
                                    ${f.label}
                                </button>
                            `).join('')}
                        </div>
                    </header>

                    <!-- 프로필 카드 영역 (순백색 카드 바탕) -->
                    <div class="p-4">
                        ${isRomance && !state.romanceAllowed ? `
                            <div class="bg-[#FFFFFF] rounded-2xl p-8 border border-[#E5E7EB] text-center space-y-4">
                                <div class="w-16 h-16 mx-auto rounded-full bg-[#FDF1F4] border border-[#F5D0DC] flex items-center justify-center text-3xl">🔒</div>
                                <h3 class="text-xl font-black text-[#1F2937]">설레는 인연 찾기가 꺼져 있어요</h3>
                                <p class="text-base text-[#6B7280] leading-relaxed">
                                    원치 않는 연락을 막기 위해 기능을 켠 회원끼리만 서로 볼 수 있습니다.
                                </p>
                                <button onclick="enableRomanceMode()" class="w-full py-4 rounded-2xl bg-[#C85A7C] text-white font-black text-lg">
                                    설레는 인연 찾기 켜기
                                </button>
                            </div>
                        ` : `
                            <div class="bg-[#FFFFFF] rounded-2xl overflow-hidden border border-[#E5E7EB]">
                                <!-- 상단 인물 사진 및 인증 배지 영역 (화이트 배경으로 시원하게 정돈) -->
                                <div class="bg-[#FFFFFF] p-6 pb-5 text-center border-b border-[#F3F4F6]">
                                    <div class="flex flex-wrap justify-center gap-1.5 mb-4">
                                        ${currentPerson.verified.map(v => `
                                            <span class="px-3 py-1 rounded-lg text-xs font-black ${
                                                v.includes('싱글')
                                                    ? 'bg-[#FDF1F4] text-[#C85A7C] border border-[#F3D1DC]'
                                                    : 'bg-[#EDF4F0] text-[#2E5A44] border border-[#CFE2D7]'
                                            }">
                                                ✓ ${v}
                                            </span>
                                        `).join('')}
                                    </div>

                                    <!-- 한국인·동양인 시니어 인물 포트레이트 -->
                                    <div class="flex justify-center mb-3">
                                        ${renderAvatarImg(
                                            currentPerson.photo,
                                            currentPerson.name,
                                            'w-28 h-28',
                                            'border-2 border-[#E5E7EB]'
                                        )}
                                    </div>

                                    <h2 class="text-2xl font-black text-[#1F2937]">
                                        ${currentPerson.name} <span class="text-lg font-bold text-[#6B7280]">(${currentPerson.age}세 · ${currentPerson.gender})</span>
                                    </h2>
                                    <p class="text-base font-bold text-[#6B7280] mt-1 flex items-center justify-center gap-1">
                                        <svg class="w-4 h-4 text-[#DC2626]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                                        <span>${currentPerson.dong}</span>
                                    </p>
                                </div>

                                <!-- 자기소개 & 공통 관심사 & 최근 일상 사진 3장 -->
                                <div class="p-5 space-y-4">
                                    <div class="bg-[#F7F8FA] p-4 rounded-xl border border-[#E5E7EB]">
                                        <p class="text-lg text-[#1F2937] leading-relaxed font-medium">
                                            "${currentPerson.intro}"
                                        </p>
                                    </div>

                                    <!-- 공통 관심사 강조 (부드러운 틴트 배지) -->
                                    <div>
                                        <p class="text-sm font-black ${isRomance ? 'text-[#C85A7C]' : 'text-[#2E5A44]'} mb-2">✨ 나와 같은 관심사</p>
                                        <div class="flex flex-wrap gap-2">
                                            ${currentPerson.commonTags.map(tag => `
                                                <span class="px-3.5 py-1.5 rounded-xl ${
                                                    isRomance
                                                        ? 'bg-[#FDF1F4] text-[#C85A7C] border border-[#F3D1DC]'
                                                        : 'bg-[#EDF4F0] text-[#2E5A44] border border-[#CFE2D7]'
                                                } font-extrabold text-base">
                                                    ${tag}
                                                </span>
                                            `).join('')}
                                            ${currentPerson.otherTags.map(tag => `
                                                <span class="px-3.5 py-1.5 rounded-xl bg-[#F7F8FA] text-[#4B5563] border border-[#E5E7EB] font-bold text-base">
                                                    ${tag}
                                                </span>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- 최근 일상 사진 3장 -->
                                    <div>
                                        <p class="text-sm font-black text-[#1F2937] mb-2">📷 최근 일상 사진 (누르면 크게 보여요)</p>
                                        <div class="grid grid-cols-3 gap-2">
                                            ${currentPerson.dailyPhotos.map(item => `
                                                <button type="button" onclick="openPhotoZoomModal('${item.url}', '${currentPerson.name}님의 일상: ${item.caption}')" class="aspect-square rounded-xl overflow-hidden border border-[#E5E7EB] bg-[#F3F4F6] focus:outline-none">
                                                    <img src="${item.url}" alt="${item.caption}" onerror="this.onerror=null;this.src='https://placehold.co/300x300/F3F4F6/374151?text=일상+사진';" class="w-full h-full object-cover active:scale-95 transition-transform">
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- 하단 2개 액션 버튼 (우측 주요 버튼에만 진한 그린 #2E5A44 또는 진한 로즈 핑크 #C85A7C 적용) -->
                                    <div class="grid grid-cols-5 gap-2.5 pt-2">
                                        <button onclick="nextNeighbor()" class="col-span-2 py-4 rounded-2xl bg-[#F7F8FA] hover:bg-[#EEF0F3] text-[#4B5563] font-extrabold text-base border border-[#E5E7EB]">
                                            다음 분 보기
                                        </button>
                                        <button onclick="openGreetingModal(${currentPerson.id})" class="col-span-3 py-4 rounded-2xl ${
                                            isRomance
                                                ? 'bg-[#C85A7C] hover:bg-[#B34B6C]'
                                                : 'bg-[#2E5A44] hover:bg-[#244736]'
                                        } text-white font-black text-base">
                                            ${isRomance ? '💕 설레는 인사 보내기' : '👋 반가워요 인사하기'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function switchNeighborMode(mode) {
            state.neighborMode = mode;
            state.neighborIndex = 0;
            renderCurrentTab();
        }

        function setNeighborFilter(filterId) {
            state.neighborFilter = filterId;
            state.neighborIndex = 0;
            renderCurrentTab();
        }

        function enableRomanceMode() {
            state.romanceAllowed = true;
            showToast('💕 설레는 인연 찾기가 켜졌습니다.');
            renderCurrentTab();
        }

        function nextNeighbor() {
            state.neighborIndex += 1;
            renderCurrentTab();
        }

        function openGreetingModal(personId) {
            const p = neighborList.find(item => item.id === personId);
            const isRomance = p.type === 'romance';
            const templates = isRomance
                ? [
                    `안녕하세요 ${p.name}님! 프로필 보고 좋은 인연이 될 것 같아 정중히 인사드립니다.`,
                    `반갑습니다 ${p.name}님! 시간이 되실 때 따뜻한 차 한잔하며 수다 나누고 싶어요.`
                ]
                : [
                    `안녕하세요 ${p.name}님! 관심사가 비슷해서 반가운 마음에 인사드립니다.`,
                    `반갑습니다! 동네에서 산책이나 식사 함께하는 편한 친구로 지내고 싶어요.`
                ];

            const modalOverlay = document.getElementById('modal-overlay');
            const modalContainer = document.getElementById('modal-container');
            modalOverlay.classList.remove('hidden');
            modalContainer.innerHTML = `
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-black text-[#1F2937]">${p.name}님께 인사 보내기</h3>
                        <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-[#F3F4F6] text-[#374151] font-bold text-lg">✕</button>
                    </div>
                    <p class="text-base text-[#6B7280]">어색하지 않도록 준비된 인사말을 눌러 바로 보내보세요.</p>
                    <div class="space-y-3">
                        ${templates.map(msg => `
                            <button onclick="sendGreeting('${p.name}', '${p.photo}', ${p.age}, '${p.dong.split(' ')[1]}', '${p.type}', '${msg}')" class="w-full p-4 rounded-2xl text-left border ${
                                isRomance
                                    ? 'border-[#F3D1DC] bg-[#FDF1F4] hover:bg-[#FCE6ED]'
                                    : 'border-[#CFE2D7] bg-[#EDF4F0] hover:bg-[#E1EDE6]'
                            } text-[#1F2937] font-bold text-base leading-relaxed">
                                "${msg}"
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function sendGreeting(name, photoUrl, age, dong, relationType, message) {
            closeModal();
            let targetChatId = '';
            const greetingMsg = { sender: '나', photo: PHOTO_ASSETS.me, text: message, time: '방금 전', isMe: true };
            const existing = chatRooms.find(c => c.type === 'direct' && c.title.includes(name));
            if (existing) {
                existing.messages.push(greetingMsg);
                existing.lastMsg = message;
                existing.time = '방금 전';
                targetChatId = existing.id;
            } else {
                targetChatId = `chat-direct-${name}`;
                chatRooms.unshift({
                    id: targetChatId,
                    type: 'direct',
                    badgeLabel: relationType === 'romance' ? '설레는 인연' : '편한 친구',
                    relationType: relationType,
                    title: `${name}님 (${age}세 · ${dong})`,
                    memberCount: 2,
                    lastMsg: message,
                    time: '방금 전',
                    unread: 0,
                    confirmed: true,
                    schedule: null,
                    messages: [greetingMsg]
                });
            }
            saveMessage(targetChatId, greetingMsg);
            state.chatFilter = 'direct';
            showToast(`💌 ${name}님께 인사를 보냈습니다! [이웃과 수다]로 이동합니다.`);
            switchTab('chat');
            openChatRoom(targetChatId);
        }

        // ==================== [탭 3: 수다 (화이트 바탕 + 부드러운 틴트 분류 탭)] ====================
        function switchChatFilter(filterType) {
            state.chatFilter = filterType;
            renderCurrentTab();
        }

        function renderChatTab(container) {
            const groupCount = chatRooms.filter(r => r.type === 'group').length;
            const directCount = chatRooms.filter(r => r.type === 'direct').length;
            const filteredRooms = chatRooms.filter(r => r.type === state.chatFilter);

            container.innerHTML = `
                <div class="fade-in">
                    <header class="bg-[#FFFFFF] px-4 pt-4 pb-3 border-b border-[#E5E7EB] sticky top-0 z-10">
                        <div class="px-1">
                            <h1 class="text-2xl font-black text-[#1F2937]">수다</h1>
                            <p class="text-sm text-[#6B7280] mt-0.5">마실 일정 확인과 반가운 안부 수다</p>
                        </div>

                        <!-- 상단 50:50 구분 탭 (부드러운 틴트 + 컬러 테두리) -->
                        <div class="grid grid-cols-2 gap-2 bg-[#F7F8FA] p-1.5 rounded-2xl border border-[#E5E7EB] mt-3">
                            <button onclick="switchChatFilter('group')" class="py-3 rounded-xl font-black text-base transition-colors border ${
                                state.chatFilter === 'group'
                                    ? 'bg-[#F5EFEA] text-[#6D4C3D] border-[#6D4C3D]'
                                    : 'border-transparent text-[#6B7280] hover:bg-[#FFFFFF]'
                            }">
                                🗓️ 함께하는 마실 (${groupCount})
                            </button>
                            <button onclick="switchChatFilter('direct')" class="py-3 rounded-xl font-black text-base transition-colors border ${
                                state.chatFilter === 'direct'
                                    ? 'bg-[#EDF4F0] text-[#2E5A44] border-[#2E5A44]'
                                    : 'border-transparent text-[#6B7280] hover:bg-[#FFFFFF]'
                            }">
                                💬 이웃과 수다 (${directCount})
                            </button>
                        </div>
                    </header>

                    <div class="p-4 space-y-3">
                        ${filteredRooms.length === 0 ? `
                            <div class="bg-[#FFFFFF] rounded-2xl p-8 border border-[#E5E7EB] text-center space-y-2">
                                <p class="text-lg font-black text-[#1F2937]">아직 나눈 수다가 없습니다</p>
                                <p class="text-base text-[#6B7280]">
                                    ${state.chatFilter === 'group'
                                        ? '마실 탭에서 마음에 드는 마실에 참여해 보세요!'
                                        : '이웃 탭에서 반가운 분께 인사를 건네보세요!'}
                                </p>
                            </div>
                        ` : filteredRooms.map(room => `
                            <div onclick="openChatRoom('${room.id}')" class="bg-[#FFFFFF] rounded-2xl p-4 border border-[#E5E7EB] hover:border-[#9CA3AF] active:scale-[0.99] transition-transform cursor-pointer">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="px-3 py-1 rounded-lg text-sm font-black ${
                                        room.type === 'group'
                                            ? 'bg-[#F5EFEA] text-[#6D4C3D] border border-[#E6D8CC]'
                                            : (room.relationType === 'romance'
                                                ? 'bg-[#FDF1F4] text-[#C85A7C] border border-[#F3D1DC]'
                                                : 'bg-[#EDF4F0] text-[#2E5A44] border border-[#CFE2D7]')
                                    }">
                                        ${room.type === 'group' ? `🗓️ ${room.badgeLabel}` : `[${room.badgeLabel}]`}
                                    </span>
                                    <span class="text-sm text-[#6B7280] font-medium">${room.time}</span>
                                </div>
                                <div class="flex justify-between items-center gap-2">
                                    <div class="min-w-0 flex-1">
                                        <h3 class="text-lg font-black text-[#1F2937] truncate">
                                            ${room.title} ${room.type === 'group' ? `<span class="text-sm font-bold text-[#6B7280]">(${room.memberCount}명)</span>` : ''}
                                        </h3>
                                        <p class="text-base text-[#6B7280] truncate mt-1">${room.lastMsg}</p>
                                    </div>
                                    ${room.unread > 0 ? `
                                        <span class="w-7 h-7 rounded-full bg-[#6D4C3D] text-white font-black text-sm flex items-center justify-center shrink-0">
                                            ${room.unread}
                                        </span>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ==================== [수다방 내부 화면] ====================
        function openChatRoom(chatId) {
            state.activeChatId = chatId;
            const room = chatRooms.find(r => r.id === chatId);
            if (!room) return;

            room.unread = 0;
            updateChatBadge();

            const subpage = document.getElementById('subpage-container');
            subpage.classList.remove('hidden');
            renderChatRoomContent(room);
            loadRoomMessages(room);
        }

        function renderChatRoomContent(room) {
            const isGroup = room.type === 'group';
            const isRomanceDirect = room.type === 'direct' && room.relationType === 'romance';
            const sendBtnBg = isGroup ? 'bg-[#6D4C3D]' : (isRomanceDirect ? 'bg-[#C85A7C]' : 'bg-[#2E5A44]');
            const myBubbleBg = isGroup ? 'bg-[#F5EFEA] text-[#1F2937] border border-[#E6D8CC]' : (isRomanceDirect ? 'bg-[#FDF1F4] text-[#1F2937] border border-[#F3D1DC]' : 'bg-[#EDF4F0] text-[#1F2937] border border-[#CFE2D7]');

            const subpage = document.getElementById('subpage-container');
            subpage.innerHTML = `
                <!-- 상단 헤더 -->
                <header class="bg-[#FFFFFF] px-4 py-3 border-b border-[#E5E7EB] flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <button onclick="closeSubpage(); renderCurrentTab();" class="px-3 py-2 rounded-xl bg-[#F3F4F6] font-bold text-base text-[#1F2937] shrink-0">
                            ← 목록
                        </button>
                        <h2 class="text-lg font-black text-[#1F2937] truncate">${room.title}</h2>
                    </div>
                </header>

                <!-- 최상단 고정 안내판 (연한 브라운 틴트) -->
                ${room.schedule ? `
                    <div class="bg-[#F5EFEA] border-b border-[#E6D8CC] p-3.5 shrink-0">
                        <div class="flex justify-between items-center">
                            <span class="font-black text-[#6D4C3D] text-base">📌 마실 일정 안내</span>
                            <button onclick="toggleNotice()" class="text-sm font-bold text-[#6D4C3D] underline">
                                ${state.isNoticeExpanded ? '접기 ▲' : '펼치기 ▼'}
                            </button>
                        </div>
                        ${state.isNoticeExpanded ? `
                            <div class="mt-2 space-y-2.5">
                                <p class="text-base font-bold text-[#1F2937]">
                                    • 일시: ${room.schedule.date}<br>
                                    • 장소: ${room.schedule.place}
                                </p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="showMapAlert('${room.schedule.place}', '${room.schedule.mapDetail}')" class="py-2.5 px-3 rounded-xl bg-[#FFFFFF] border border-[#E5E7EB] font-extrabold text-sm text-[#374151]">
                                        🗺️ 약속 장소 지도 보기
                                    </button>
                                    <button onclick="confirmAttendance('${room.id}')" class="py-2.5 px-3 rounded-xl font-extrabold text-sm ${
                                        room.confirmed
                                            ? 'bg-[#FFFFFF] border border-[#6D4C3D] text-[#6D4C3D]'
                                            : 'bg-[#6D4C3D] text-white'
                                    }">
                                        ${room.confirmed ? '✓ 참석 확정됨' : '✋ 참석 확정 누르기'}
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                ` : ''}

                <!-- 수다 메시지 영역 -->
                <div id="chat-messages-box" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">
                    ${room.messages.map(m => m.isMe ? `
                        <div class="flex flex-col items-end">
                            <div class="${myBubbleBg} px-4 py-3 rounded-2xl rounded-tr-sm max-w-[82%] text-lg font-medium leading-relaxed">
                                ${m.text}
                            </div>
                            <span class="text-xs text-[#6B7280] mt-1 mr-1">${m.time}</span>
                        </div>
                    ` : `
                        <div class="flex items-start gap-2.5">
                            ${renderAvatarImg(m.photo, m.sender, 'w-10 h-10', 'border border-[#E5E7EB]')}
                            <div class="max-w-[78%]">
                                <span class="text-sm font-bold text-[#6B7280] ml-1">${m.sender}</span>
                                <div class="bg-[#FFFFFF] border border-[#E5E7EB] text-[#1F2937] px-4 py-3 rounded-2xl rounded-tl-sm text-lg font-medium leading-relaxed mt-1">
                                    ${m.text}
                                </div>
                                <span class="text-xs text-[#6B7280] mt-1 ml-1 block">${m.time}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- 하단 입력창 (오직 '전송' 버튼만 진한 포인트 컬러) -->
                <div class="bg-[#FFFFFF] border-t border-[#E5E7EB] p-3 shrink-0">
                    <div class="flex items-center gap-1.5">
                        <button onclick="showToast('📷 사진 보내기 및 장소 공유 메뉴입니다.')" class="w-11 h-12 rounded-xl bg-[#F7F8FA] text-[#374151] border border-[#E5E7EB] font-black text-xl shrink-0 flex items-center justify-center" title="더보기">
                            +
                        </button>
                        <button onclick="simulateVoiceInput()" class="px-2.5 h-12 rounded-xl bg-[#F7F8FA] text-[#374151] border border-[#E5E7EB] font-bold text-sm shrink-0 flex items-center gap-1" title="말로 글쓰기">
                            <span>🎤</span>
                            <span>말하기</span>
                        </button>
                        <input id="chat-input" type="text" placeholder="수다 입력" onkeypress="if(event.key==='Enter') sendChatMessage()" class="flex-1 min-w-0 h-12 px-3 rounded-xl border border-[#D1D5DB] bg-[#FFFFFF] text-lg focus:outline-none focus:border-[#6D4C3D]">
                        <button onclick="sendChatMessage()" class="px-4 h-12 rounded-xl ${sendBtnBg} text-white font-black text-base shrink-0">
                            전송
                        </button>
                    </div>
                </div>
            `;

            const msgBox = document.getElementById('chat-messages-box');
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function toggleNotice() {
            state.isNoticeExpanded = !state.isNoticeExpanded;
            const room = chatRooms.find(r => r.id === state.activeChatId);
            if (room) renderChatRoomContent(room);
        }

        function confirmAttendance(chatId) {
            const room = chatRooms.find(r => r.id === chatId);
            if (!room || room.confirmed) {
                showToast('이미 참석 확정이 완료되었습니다.');
                return;
            }
            room.confirmed = true;
            const confirmMsg = {
                sender: '나',
                photo: PHOTO_ASSETS.me,
                text: '✋ 마실 참석 확정합니다! 반갑게 뵙겠습니다.',
                time: '방금 전',
                isMe: true
            };
            room.messages.push(confirmMsg);
            saveMessage(room.id, confirmMsg);
            showToast('✓ 참석이 확정되어 참여자분들께 알렸습니다.');
            renderChatRoomContent(room);
        }

        function showMapAlert(place, detail) {
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContainer = document.getElementById('modal-container');
            modalOverlay.classList.remove('hidden');
            modalContainer.innerHTML = `
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-black text-[#1F2937]">🗺️ 만나는 장소 안내</h3>
                        <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-[#F3F4F6] text-[#374151] font-bold text-lg">✕</button>
                    </div>
                    <div class="bg-[#F7F8FA] border border-[#E5E7EB] rounded-2xl p-4 space-y-2">
                        <p class="text-lg font-black text-[#6D4C3D]">📍 ${place}</p>
                        <p class="text-base text-[#1F2937] leading-relaxed">${detail}</p>
                    </div>
                    <div class="bg-[#F7F8FA] rounded-2xl h-36 flex flex-col items-center justify-center border border-[#E5E7EB] text-[#4B5563] font-bold">
                        <span class="text-3xl mb-1">🧭</span>
                        <span>큰 글씨 길찾기 지도 화면</span>
                    </div>
                    <button onclick="closeModal()" class="w-full py-4 rounded-2xl bg-[#6D4C3D] text-white font-black text-lg">
                        확인했습니다
                    </button>
                </div>
            `;
        }

        function simulateVoiceInput() {
            const input = document.getElementById('chat-input');
            input.value = '네, 저도 시간 맞춰서 일찍 나가겠습니다!';
            showToast('🎤 말씀하신 내용이 글자로 입력되었습니다. [전송]을 눌러주세요.');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const room = chatRooms.find(r => r.id === state.activeChatId);
            if (!room) return;

            const newMsg = {
                sender: '나',
                photo: PHOTO_ASSETS.me,
                text: text,
                time: '방금 전',
                isMe: true
            };
            room.messages.push(newMsg);
            saveMessage(room.id, newMsg);
            room.lastMsg = text;
            room.time = '방금 전';

            renderChatRoomContent(room);
        }

        // ==================== [탭 4: 내 정보 (화이트 바탕 + 절제된 포인트)] ====================
        function renderMyTab(container) {
            container.innerHTML = `
                <div class="fade-in p-4 space-y-4">
                    <h1 class="text-2xl font-black text-[#1F2937] px-1 pt-1">내 정보</h1>

                    <!-- 내 프로필 카드 -->
                    <div class="bg-[#FFFFFF] rounded-2xl p-5 border border-[#E5E7EB] flex items-center gap-4">
                        ${renderAvatarImg(PHOTO_ASSETS.me, '최순자', 'w-20 h-20', 'border border-[#E5E7EB]')}
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <h2 class="text-2xl font-black text-[#1F2937]">최순자</h2>
                                <span class="text-base font-bold text-[#6B7280]">(66세·여성)</span>
                            </div>
                            <p class="text-base font-bold text-[#6B7280] mt-0.5">📍 ${state.selectedNeighborhood}</p>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <span class="px-2.5 py-0.5 rounded-md bg-[#EDF4F0] text-[#2E5A44] border border-[#CFE2D7] font-extrabold text-xs">✓ 본인인증 완료</span>
                                <span class="px-2.5 py-0.5 rounded-md bg-[#FDF1F4] text-[#C85A7C] border border-[#F3D1DC] font-extrabold text-xs">✓ 싱글 인증</span>
                            </div>
                        </div>
                    </div>

                    <!-- 화면 및 만남 설정 -->
                    <div class="bg-[#FFFFFF] rounded-2xl p-5 border border-[#E5E7EB] space-y-4">
                        <h3 class="text-lg font-black text-[#1F2937]">글씨 및 만남 설정</h3>

                        <!-- 글씨 크기 설정 -->
                        <div class="flex items-center justify-between py-2 border-b border-[#F3F4F6]">
                            <div>
                                <p class="text-lg font-bold text-[#1F2937]">글씨 더 크게 보기</p>
                                <p class="text-sm text-[#6B7280]">화면의 글자와 버튼을 크게 봅니다</p>
                            </div>
                            <button onclick="toggleLargeText()" class="px-4 py-2.5 rounded-xl font-black text-base border ${
                                state.largeText
                                    ? 'bg-[#F5EFEA] text-[#6D4C3D] border-[#6D4C3D]'
                                    : 'bg-[#FFFFFF] text-[#4B5563] border-[#E5E7EB]'
                            }">
                                ${state.largeText ? '크게 보기 켜짐' : '보통 크기'}
                            </button>
                        </div>

                        <!-- 설레는 인연 공개 설정 -->
                        <div class="flex items-center justify-between py-2 border-b border-[#F3F4F6]">
                            <div>
                                <p class="text-lg font-bold text-[#1F2937]">설레는 인연 공개 설정</p>
                                <p class="text-sm text-[#6B7280]">이성 인연 찾기 노출 여부를 정합니다</p>
                            </div>
                            <button onclick="toggleRomanceSetting()" class="px-3.5 py-2.5 rounded-xl font-black text-sm border ${
                                state.romanceAllowed
                                    ? 'bg-[#FDF1F4] text-[#C85A7C] border-[#C85A7C]'
                                    : 'bg-[#FFFFFF] text-[#6B7280] border-[#E5E7EB]'
                            }">
                                ${state.romanceAllowed ? '설레는 인연도 함께' : '편한 친구만'}
                            </button>
                        </div>

                        <!-- 차단 목록 관리 -->
                        <div class="flex items-center justify-between pt-1">
                            <div>
                                <p class="text-lg font-bold text-[#1F2937]">차단 목록 관리</p>
                                <p class="text-sm text-[#6B7280]">불편한 이용자 차단 및 신고 내역</p>
                            </div>
                            <button onclick="showToast('🛡️ 차단된 회원이 없습니다. 안전하게 보호 중입니다.')" class="px-4 py-2.5 rounded-xl bg-[#FFFFFF] border border-[#E5E7EB] text-[#374151] font-bold text-sm">
                                관리 &gt;
                            </button>
                        </div>
                    </div>

                    ${!isStandalone() ? `
                    <!-- 홈 화면에 앱 설치 카드 -->
                    <div class="bg-[#FFFFFF] rounded-2xl p-5 border border-[#E5E7EB] space-y-3">
                        <h3 class="text-lg font-black text-[#1F2937]">📲 휴대폰에 앱으로 설치하기</h3>
                        <p class="text-base text-[#6B7280] leading-relaxed">
                            홈 화면에 마실수다 아이콘을 만들어 두면 앱처럼 바로 열 수 있어요.
                        </p>
                        <button onclick="installApp()" class="w-full py-4 rounded-2xl bg-[#FFFFFF] border-2 border-[#6D4C3D] text-[#6D4C3D] font-black text-lg">
                            홈 화면에 추가하기
                        </button>
                    </div>
                    ` : ''}

                    <!-- 시니어 안심 고객센터 전화 연결 카드 -->
                    <div class="bg-[#FFFFFF] rounded-2xl p-5 border border-[#E5E7EB] space-y-3">
                        <h3 class="text-lg font-black text-[#1F2937]">📞 도움이 필요하신가요?</h3>
                        <p class="text-base text-[#6B7280] leading-relaxed">
                            앱 사용이 어렵거나 불편한 점이 있다면 상담원에게 바로 전화해 주세요.
                        </p>
                        <button onclick="showToast('📞 마실수다 시니어 전담 고객센터(1588-0000)로 전화 연결합니다.')" class="w-full py-4 rounded-2xl bg-[#6D4C3D] hover:bg-[#583D31] text-white font-black text-lg">
                            전화 고객센터 연결 (1588-0000)
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleRomanceSetting() {
            state.romanceAllowed = !state.romanceAllowed;
            showToast(state.romanceAllowed ? '💕 설레는 인연 찾기가 켜졌습니다.' : '🤝 편한 친구만 찾도록 변경되었습니다.');
            renderCurrentTab();
        }

        // ==================== 모달 / 서브페이지 닫기 ====================
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function closeSubpage() {
            document.getElementById('subpage-container').classList.add('hidden');
        }

        // ==================== 앱 설치 (홈 화면에 추가) ====================
        let deferredInstallPrompt = null;

        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            showToast('🎉 홈 화면에 마실수다가 설치되었습니다!');
            if (state.currentTab === 'my') renderCurrentTab();
        });

        function installApp() {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; });
                return;
            }
            const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const steps = isIOS
                ? ['Safari로 이 페이지를 열어 주세요.', '화면 아래 <strong>공유 버튼</strong>(네모에 위쪽 화살표)을 누르세요.', '<strong>홈 화면에 추가</strong>를 누르고 오른쪽 위 <strong>추가</strong>를 누르세요.']
                : ['크롬(Chrome)으로 이 페이지를 열어 주세요.', '오른쪽 위 <strong>점 세 개(⋮)</strong> 메뉴를 누르세요.', '<strong>홈 화면에 추가</strong> 또는 <strong>앱 설치</strong>를 누르세요.'];
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContainer = document.getElementById('modal-container');
            modalOverlay.classList.remove('hidden');
            modalContainer.innerHTML = `
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-black text-[#1F2937]">📲 홈 화면에 추가하는 방법</h3>
                        <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-[#F3F4F6] text-[#374151] font-bold text-lg">✕</button>
                    </div>
                    <ol class="space-y-3">
                        ${steps.map((t, i) => `
                            <li class="flex gap-3 items-start bg-[#F7F8FA] border border-[#E5E7EB] rounded-2xl p-4">
                                <span class="w-8 h-8 rounded-full bg-[#6D4C3D] text-white font-black flex items-center justify-center shrink-0">${i + 1}</span>
                                <span class="text-lg text-[#1F2937] leading-relaxed">${t}</span>
                            </li>
                        `).join('')}
                    </ol>
                    <button onclick="closeModal()" class="w-full py-4 rounded-2xl bg-[#6D4C3D] text-white font-black text-lg">확인했습니다</button>
                </div>
            `;
        }

        // ==================== 휴대폰 '뒤로' 버튼 처리 ====================
        // 상세 화면이나 팝업이 열려 있을 때 '뒤로'를 누르면 앱이 꺼지지 않고 그 화면만 닫힙니다.
        let historyDepth = 0;
        let ignoreNextPop = false;

        function visibleLayerCount() {
            return ['modal-overlay', 'subpage-container']
                .filter(id => !document.getElementById(id).classList.contains('hidden')).length;
        }

        function syncHistoryWithLayers() {
            const depth = visibleLayerCount();
            if (depth > historyDepth) {
                for (let i = historyDepth; i < depth; i++) history.pushState({ masilLayer: i + 1 }, '');
            } else if (depth < historyDepth) {
                ignoreNextPop = true;
                history.go(depth - historyDepth);
            }
            historyDepth = depth;
        }

        window.addEventListener('popstate', () => {
            if (ignoreNextPop) { ignoreNextPop = false; return; }
            if (!document.getElementById('modal-overlay').classList.contains('hidden')) {
                closeModal();
            } else if (!document.getElementById('subpage-container').classList.contains('hidden')) {
                closeSubpage();
                renderCurrentTab();
            }
            historyDepth = visibleLayerCount();
        });

        const layerObserver = new MutationObserver(syncHistoryWithLayers);
        ['modal-overlay', 'subpage-container'].forEach(id =>
            layerObserver.observe(document.getElementById(id), { attributes: true, attributeFilter: ['class'] })
        );

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('서비스 워커 등록 실패', err));
        }

        // 초기 실행
        window.onload = function () {
            switchTab('home');
            updateChatBadge();
            loadFromDb();
        };
    </script>
</body>
</html>
